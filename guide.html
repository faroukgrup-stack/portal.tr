<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Kullanıcı Kılavuzu – Kapsamlı Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden;
            font-family: 'Tajawal', sans-serif;
            background: #0b0e17; color: #f0f4fa;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            padding: 1rem;
        }

        /* ===== Tüm titreşimlere neden olan öğeleri sıfırla ===== */
        .container, header, .search-wrapper, .tool-card, .back-btn,
        .tool-content, .no-results, footer, .collapsible-header {
            transform: none !important;
            -webkit-transform: none !important;
            will-change: auto !important;
            backface-visibility: visible !important;
            -webkit-backface-visibility: visible !important;
            animation: none !important;
            transition: none !important;
        }

        /* ===== Sabit arka plan ===== */
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 70% 30%, #141c2b, #0a0e16);
            z-index: -1;
        }

        /* ===== Konteyner ===== */
        .container {
            max-width: 1100px; margin: 0 auto;
            position: relative; z-index: 1;
        }

        /* ===== Başlık ===== */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-top: 0.5rem;
        }
        header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #d4b15a;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        header h1 i { color: #b48554; }
        header p {
            color: #aab7d4;
            font-size: 0.95rem;
            margin-top: 0.3rem;
        }

        /* ===== Geri dön butonu ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(180,133,84,0.12);
            border: 2px solid rgba(180,133,84,0.2);
            border-radius: 50px;
            padding: 0.4rem 1.2rem;
            color: #cfa776;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            margin-bottom: 1rem;
        }
        .back-btn:hover { background: rgba(180,133,84,0.25); border-color: #b48554; }
        .back-btn i { color: #b48554; }

        /* ===== Arama ===== */
        .search-wrapper {
            position: relative;
            max-width: 100%;
            margin: 0.8rem auto 1.5rem;
        }
        .search-wrapper i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #b48554;
            font-size: 1rem;
            pointer-events: none;
        }
        #searchInput {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 3rem;
            border-radius: 50px;
            border: 2px solid rgba(180,133,84,0.2);
            background: rgba(18,24,36,0.8);
            backdrop-filter: blur(8px);
            color: #f0f4fa;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            outline: none;
        }
        #searchInput:focus {
            border-color: #b48554;
            box-shadow: 0 0 0 3px rgba(180,133,84,0.15);
            background: rgba(22,30,46,0.9);
        }
        #searchInput::placeholder {
            color: #6a7a8e;
        }

        /* ===== Araç grid'i ===== */
        .tools-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ===== Araç kartı (katlanabilir) ===== */
        .tool-card {
            background: rgba(22,30,46,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(180,133,84,0.15);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.4);
        }
        .tool-card:hover {
            border-color: rgba(180,133,84,0.3);
        }

        .collapsible-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.2rem;
            cursor: pointer;
            gap: 0.8rem;
            user-select: none;
            background: rgba(15,20,30,0.3);
        }
        .collapsible-header h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #cfa776;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }
        .collapsible-header h2 i {
            color: #b48554;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .collapsible-header .toggle-icon {
            color: #aab7d4;
            font-size: 1.2rem;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .collapsible-header .toggle-icon.open {
            transform: rotate(180deg);
        }

        .tool-content {
            padding: 0 1.2rem 1.2rem;
            color: #d0d9e8;
            font-size: 0.95rem;
            line-height: 1.8;
            display: none;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        .tool-content.open {
            display: block;
        }

        .tool-content h3 {
            font-size: 1.1rem;
            margin: 1.2rem 0 0.6rem;
            color: #e2c5a3;
        }
        .tool-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.6rem 0;
            font-size: 0.85rem;
            background: rgba(10,14,23,0.4);
            border-radius: 12px;
            overflow: hidden;
        }
        .tool-content th,
        .tool-content td {
            border: 1px solid rgba(180,133,84,0.15);
            padding: 0.4rem 0.6rem;
            text-align: left;
        }
        .tool-content th {
            background: rgba(180,133,84,0.1);
            color: #f0e6d2;
            font-weight: 700;
        }
        .tool-content td {
            color: #d0d9e8;
        }

        /* ===== Sonuç yok ===== */
        .no-results {
            text-align: center;
            font-size: 1.1rem;
            color: #aab7d4;
            margin-top: 2rem;
            display: none;
        }
        .no-results i {
            color: #b48554;
            margin-right: 0.5rem;
        }

        /* ===== Footer ===== */
        footer {
            text-align: center;
            color: #aab7d4;
            margin-top: 2rem;
            font-size: 0.8rem;
            padding-bottom: 0.5rem;
        }
        footer span {
            color: #cfa776;
            font-weight: 700;
        }

        /* ===================================================
           Mobil iyileştirmeler
           =================================================== */
        @media (max-width: 768px) {
            body { padding: 0.8rem; }
            header h1 { font-size: 1.5rem; }
            header p { font-size: 0.85rem; }
            .back-btn { font-size: 0.8rem; padding: 0.3rem 1rem; }
            #searchInput { font-size: 0.9rem; padding: 0.7rem 1rem 0.7rem 2.8rem; }
            .collapsible-header { padding: 0.8rem 1rem; }
            .collapsible-header h2 { font-size: 1rem; }
            .collapsible-header h2 i { font-size: 1rem; }
            .tool-content { font-size: 0.9rem; padding: 0 0.8rem 0.8rem; }
            .tool-content table { font-size: 0.8rem; }
            .tool-content th, .tool-content td { padding: 0.3rem 0.5rem; }
        }

        @media (max-width: 400px) {
            header h1 { font-size: 1.2rem; }
            .collapsible-header h2 { font-size: 0.9rem; flex-wrap: wrap; }
            .collapsible-header .toggle-icon { font-size: 1rem; }
            .tool-content { font-size: 0.85rem; }
        }
    </style>
</head>

        const container = document.getElementById('toolsContainer');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        function renderTools(filter = '') {
            const filtered = tools.filter(tool =>
                tool.name.includes(filter) || filter === ''
            );
            container.innerHTML = '';
            if (filtered.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            filtered.forEach((tool, index) => {
                const card = document.createElement('div');
                card.className = 'tool-card';

                const header = document.createElement('div');
                header.className = 'collapsible-header';
                header.innerHTML = `
                    <h2><i class="fas ${tool.icon}"></i> ${tool.name}</h2>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                `;

                const content = document.createElement('div');
                content.className = 'tool-content';
                content.innerHTML = tool.content;

                header.addEventListener('click', function() {
                    const isOpen = content.classList.contains('open');
                    content.classList.toggle('open');
                    const icon = this.querySelector('.toggle-icon');
                    if (icon) {
                        icon.classList.toggle('open');
                    }
                });

                if (index === 0 && filter === '') {
                    content.classList.add('open');
                    header.querySelector('.toggle-icon').classList.add('open');
                }

                card.appendChild(header);
                card.appendChild(content);
                container.appendChild(card);
            });
        }

        searchInput.addEventListener('input', function(e) {
            const val = e.target.value.trim();
            renderTools(val);
        });

        renderTools();
    </script>
